[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykata"
version = "0.1.0"
description = "CI/CD showcase: serverless kata platform with FastAPI, Lambda, and Terraform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Nicolás Sabogal", email = "ndsabogalv@gmail.com"}
]
keywords = ["ci-cd", "fastapi", "lambda", "terraform", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "mangum>=0.17,<1.0",
    "pydantic>=2.4,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "boto3>=1.28,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-asyncio>=0.21,<1.0",
    "black>=24.0,<25.0",
    "flake8>=6.1,<8.0",
    "flake8-bugbear>=24.1.17,<25.0",
    "mypy>=1.8,<2.0",
    "pre-commit>=3.5,<4.0",
    "httpx>=0.24,<1.0",
]

[project.urls]
Homepage = "https://github.com/MrPocketMonsters/pykata"
Repository = "https://github.com/MrPocketMonsters/pykata.git"
Issues = "https://github.com/MrPocketMonsters/pykata/issues"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
extend-select = ["B950"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_optional = false

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party libs without bundled type hints
module = ["fastapi.*", "starlette.*", "pydantic_settings.*", "mangum.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/services/__code_wrapper.py",
    "*/tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false
