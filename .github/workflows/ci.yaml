name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

      - name: Run tests with coverage
        run: |
          pytest -m unit --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    needs: ci
    services:
      localstack:
        image: localstack/localstack:latest
        env:
          SERVICES: dynamodb,s3,lambda,apigateway,iam,sqs,sns,cloudwatch,logs
          DEBUG: "1"
        ports:
          - 4566:4566
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify LocalStack health
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:4566/_localstack/health | grep -q '"dynamodb": "available"'; then
              echo "LocalStack ready"
              exit 0
            fi
            echo "Waiting for LocalStack... ($i/30)"
            sleep 2
          done
          echo "LocalStack failed to become ready"
          exit 1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Apply Terraform (dev) against LocalStack
        run: |
          terraform -chdir=terraform/environments/dev init -input=false
          terraform -chdir=terraform/environments/dev apply -auto-approve -input=false

      - name: Run integration tests (dev suite)
        run: |
          pytest -m "integration and not prod_integration"
