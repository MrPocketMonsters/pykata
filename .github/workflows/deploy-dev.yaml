name: Deploy and Test Dev Environment

on:
  pull_request:
    branches: [master]
    # Commented it to test on PR before the merge
    # Uncomment before merging to execute only PRs close
    # types:
    #   - closed

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Load Environment Variables
        run: |
          set -a
          source .env.example
          set +a

      - name: Start LocalStack with execution through Docker
        run: |
          docker compose -f docker/docker-compose.yml up -d

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Package Lambda function
        run: |
          python -m scripts.package_lambda

      - name: Apply Terraform (dev) against LocalStack
        run: |
          terraform -chdir=terraform/environments/dev init -input=false
          terraform -chdir=terraform/environments/dev apply -auto-approve -input=false

      - name: Run end-to-end tests against dev environment
        run: |
          pytest -m e2e
